name: Compile ESP32 Sketches

on:
  workflow_dispatch:

env:
  ESP32_CORE_VERSION: 3.3.12
  ARDUINO_CLI_VERSION: 1.5.1

jobs:
  # --------------------------------------------------
  # Read FW_VERSION from configure.h, refuse a version already released
  # --------------------------------------------------
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read firmware version
        id: read
        run: |
          VERSION=$(sed -n 's/^#define FW_VERSION *"\([^"]*\)".*/\1/p' configure.h)
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Could not read FW_VERSION from configure.h (got '$VERSION')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/firmware-$VERSION" >/dev/null; then
            echo "::error::firmware-$VERSION is already released: bump FW_VERSION in configure.h"
            exit 1
          fi
          echo "Firmware version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32
            fqbn: esp32:esp32:esp32
            board-options: PartitionScheme=custom
            build-dir: build_esp32
            extra-cpp-flags: -DUSE_COLORDISPLAY=0 -DUSE_ZIGBEE=0 -DDEFAULT_PIN_PRESET_ESP32

          - name: ESP32-Waveshare
            fqbn: esp32:esp32:esp32
            board-options: PartitionScheme=custom
            build-dir: build_esp32_waveshare
            extra-cpp-flags: -DUSE_COLORDISPLAY=0 -DUSE_ZIGBEE=0 -DDEFAULT_PIN_PRESET_ESP32_WAVESHARE

          - name: ESP32C6-FireBeetle
            fqbn: esp32:esp32:dfrobot_firebeetle2_esp32c6
            board-options: PartitionScheme=custom,CDCOnBoot=cdc
            build-dir: build_esp32c6_firebeetle
            extra-cpp-flags: -DUSE_COLORDISPLAY=0 -DUSE_ZIGBEE=0 -DDEFAULT_PIN_PRESET_ESP32C6_FIREBEETLE

          - name: ESP32C6-FireBeetle-Zigbee
            fqbn: esp32:esp32:dfrobot_firebeetle2_esp32c6
            board-options: PartitionScheme=custom,ZigbeeMode=zczr,CDCOnBoot=cdc
            build-dir: build_esp32c6_firebeetle_zigbee
            extra-cpp-flags: -DUSE_COLORDISPLAY=0 -DUSE_ZIGBEE=1 -DDEFAULT_PIN_PRESET_ESP32C6_FIREBEETLE

          - name: ESP32C6-SuperMini
            fqbn: esp32:esp32:makergo_c6_supermini
            board-options: PartitionScheme=custom,CDCOnBoot=cdc
            build-dir: build_esp32c6_supermini
            extra-cpp-flags: -DUSE_COLORDISPLAY=0 -DUSE_ZIGBEE=0 -DDEFAULT_PIN_PRESET_ESP32C6_SUPERMINI

          - name: ESP32C6-SuperMini-Zigbee
            fqbn: esp32:esp32:makergo_c6_supermini
            board-options: PartitionScheme=custom,ZigbeeMode=zczr,CDCOnBoot=cdc
            build-dir: build_esp32c6_supermini_zigbee
            extra-cpp-flags: -DUSE_COLORDISPLAY=0 -DUSE_ZIGBEE=1 -DDEFAULT_PIN_PRESET_ESP32C6_SUPERMINI

    steps:
      - uses: actions/checkout@v7

      # ------------------------------
      # Cache Arduino packages
      # ------------------------------
      - name: Cache Arduino packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
            ~/Arduino/libraries
          # Bump the version list here together with the installs below.
          key: arduino-${{ runner.os }}-esp32-${{ env.ESP32_CORE_VERSION }}-gxepd2-1.6.9-gfx-1.12.6-busio-1.17.4-json-7.4.3-pubsub-2.8

      # ------------------------------
      # Arduino CLI
      # ------------------------------
      # arduino/setup-arduino-cli still runs on Node.js 20: use the official install script.
      - name: Setup Arduino CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh -s "$ARDUINO_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 Arduino Core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ env.ESP32_CORE_VERSION }}

      # ------------------------------
      # Libraries
      # ------------------------------
      - name: Install required libraries
        run: |
          arduino-cli lib install \
            "Adafruit GFX Library@1.12.6" \
            "Adafruit BusIO@1.17.4" \
            "GxEPD2@1.6.9" \
            "ArduinoJson@7.4.3" \
            "PubSubClient@2.8"

      # ------------------------------
      # Patches
      # ------------------------------
      - name: Patch GxEPD2 for ESP32
        run: |
          sed -i 's|#include <avr/pgmspace.h>|#include <pgmspace.h>|' \
            ~/Arduino/libraries/GxEPD2/src/GxEPD2_EPD.cpp

      - name: Patch Adafruit_BusIO for ESP32 core 3.x
        run: |
          FILE="$HOME/Arduino/libraries/Adafruit_BusIO/Adafruit_SPIDevice.h"
          sed -i 's/SPI_BITORDER_MSBFIRST = SPI_MSBFIRST/SPI_BITORDER_MSBFIRST = MSBFIRST/' "$FILE"
          sed -i 's/SPI_BITORDER_LSBFIRST = SPI_LSBFIRST/SPI_BITORDER_LSBFIRST = LSBFIRST/' "$FILE"

      # ------------------------------
      # Compile
      # ------------------------------
      - name: Compile sketch
        run: |
          # partitions.csv in the sketch folder is picked up by the core; the size limit
          # must match its app0 partition (0x360000).
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --board-options ${{ matrix.board-options }} \
            --build-property "upload.maximum_size=3538944" \
            --build-property "compiler.cpp.extra_flags=${{ matrix.extra-cpp-flags }}" \
            --export-binaries \
            --output-dir ${{ matrix.build-dir }} \
            ./ESP32-eInk-Dashboard.ino

      # ------------------------------
      # Rename firmware to clean names
      # ------------------------------
      - name: Rename firmware
        run: |
          mkdir -p firmware
          cp ${{ matrix.build-dir }}/*.bin firmware/

          cd firmware
          for f in *.bin; do
            mv "$f" "${{ matrix.name }}-$f"
          done

      # ------------------------------
      # Upload artifact (still useful)
      # ------------------------------
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-Firmware
          path: firmware
          retention-days: 90

  # --------------------------------------------------
  # Create release only if ALL builds succeeded
  # --------------------------------------------------
  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: firmware

      - name: Create release and upload firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware-${{ needs.version.outputs.version }}
          name: ESP32 Firmware Build ${{ needs.version.outputs.version }}
          files: firmware/**/*.bin
